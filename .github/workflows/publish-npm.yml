name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Match npm provenance repository metadata
        run: npm pkg set repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
      - run: npm publish --access public
