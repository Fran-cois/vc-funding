name: Draft release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate tag and build artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/check-release.sh "${RELEASE_VERSION#v}"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/vc-funding-*.zip
          dist/vc-funding-*.zip.sha256
          --draft
          --verify-tag
          --title "vc-funding ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
