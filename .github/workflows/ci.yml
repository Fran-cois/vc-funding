name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: ./scripts/build-app.sh
      - run: codesign --verify --deep --strict .build/vc-funding.app
