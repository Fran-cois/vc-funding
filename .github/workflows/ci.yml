name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: swift test
      - run: npm run pack:check
      - run: ./scripts/build-app.sh
      - run: codesign --verify --deep --strict .build/vc-funding.app
